    <style>:root{--ink:#2b3a2e;--soft:#5c6b5e;--red:#c9463b;--yellow:#f4c430}*{box-sizing:border-box}html{background:radial-gradient(90% 60% at 72% 0,#fffdf6 0%,#fffdf600 70%),linear-gradient(200deg,#f7f1df 0%,#ece9d2 55%,#dfe6cf 100%) fixed;min-height:100%}body{padding:max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));color:var(--ink);-webkit-tap-highlight-color:transparent;margin:0;font-family:ui-rounded,SF Pro Rounded,Nunito,Avenir Next,PingFang SC,system-ui,sans-serif}header{text-align:center;margin:clamp(8px,3vh,36px) 0 clamp(28px,6vh,64px)}h1{letter-spacing:.04em;margin:0;font-size:clamp(40px,7vw,72px);font-weight:800;line-height:1.1}header p{color:var(--soft);margin:10px 0 0;font-size:clamp(18px,2.4vw,24px);font-weight:700}.shelf{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(36px,5vw,64px) clamp(28px,4vw,56px);max-width:1240px;margin:0 auto;padding:0;list-style:none;display:grid}.book{color:inherit;border-radius:14px;text-decoration:none;display:block}.book:focus-visible{outline:4px solid var(--red);outline-offset:10px}.cover{aspect-ratio:2000/1494;transform:rotate(var(--lean,0deg));background:#f6f0e0;border-radius:5px 10px 10px 5px;transition:transform .28s cubic-bezier(.2,.8,.3,1),box-shadow .28s;position:relative;overflow:hidden;box-shadow:0 1px 1px #4a3a1c33,0 10px 18px #4a3a1c29,0 26px 44px #4a3a1c29}.shelf li:nth-child(odd) .cover{--lean:-1.6deg}.shelf li:nth-child(2n) .cover{--lean:1.3deg}.cover img{object-fit:cover;width:100%;height:100%;display:block}.cover:after{content:"";pointer-events:none;background:linear-gradient(90deg,#00000029 0,#ffffff38 1.4%,#0000001a 2.6%,#fff0 5%);position:absolute;inset:0}.book:hover .cover,.book:focus-visible .cover{transform:rotate(0)translateY(-8px)scale(1.02);box-shadow:0 1px 1px #4a3a1c33,0 16px 26px #4a3a1c2e,0 40px 64px #4a3a1c33}.book:active .cover{transform:rotate(0)scale(.98)}.words{text-align:center;margin-top:clamp(18px,2.6vw,28px)}.label{background:var(--yellow);border-radius:999px;margin-top:12px;padding:5px 14px;font-size:15px;font-weight:800;display:inline-block}.zh{font-size:clamp(26px,3.4vw,34px);font-weight:800;line-height:1.25;display:block}.en{color:var(--soft);margin-top:4px;font-size:clamp(18px,2.2vw,22px);font-weight:700;display:block}.soon .cover{box-shadow:none;color:var(--soft);background:#ffffff57;border:3px dashed #5c6b5e73;place-items:center;font-size:clamp(56px,8vw,88px);font-weight:300;display:grid}.soon .cover:after{display:none}.soon .zh,.soon .en{color:var(--soft)}@media (prefers-reduced-motion:reduce){.cover{transition:none}}</style>
